name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip (jika ada)
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -qo "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          DIR=$(dirname "$(find . -name 'settings.gradle*' -not -path './.git/*' | head -1)")
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -path '*build/outputs/apk/debug/*.apk' | head -1)
          cp "$APK" App.apk
          gh release create "apk-${{ github.run_number }}" App.apk --title "APK #${{ github.run_number }}" --notes "Unduh App.apk lalu pasang."
